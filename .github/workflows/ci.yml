name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Run Python tests
        run: pytest pipeline/tests/ -v

      # Guards the committed data: schema, tag vocabulary, benchmark provenance,
      # Wizard score coverage, and the model-sources.json file the weekly sync
      # cannot run without.
      - name: Validate data
        run: python pipeline/validate_data.py

      # Confirms curated.py still joins cleanly against the live OpenRouter API,
      # so a model disappearing upstream is caught here and not on a Monday.
      - name: Check curated models still resolve
        run: python pipeline/build_models.py --dry-run

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend deps
        run: cd app && npm ci

      - name: Lint
        run: cd app && npm run lint

      - name: Build Next.js
        run: cd app && npm run build
